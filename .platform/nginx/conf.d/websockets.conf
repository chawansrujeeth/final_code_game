# Allow WebSocket upgrade for Socket.IO
# The filename itself (`websockets.conf`) is arbitrary; EB merges all *.conf files in this folder
# This block listens on the container port (8080) and proxies `/socket.io/` requests with the
# proper Upgrade headers so Elastic Load Balancer can establish a WSS tunnel.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  # EB’s default nginx forwards traffic to the application container on 8080
      listen 8080; # Port forwarded by EB to the Docker container

  location /socket.io/ {
        proxy_pass         http://127.0.0.1:8080; # Forward to Node server inside container
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
}
